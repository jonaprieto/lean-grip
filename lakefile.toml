name = "grip"
version = "0.1.0"
defaultTargets = ["Grip"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Grip"
# Build every module under Grip/, not just what the root re-exports, so no
# submodule can hide unbuilt (and untested) behind a missing import.
globs = ["Grip", "Grip.+"]

[[lean_lib]]
name = "Examples"
srcDir = "examples"
globs = ["Json", "Sexp", "Lambda", "Http", "Toml", "Yaml"]

[[lean_lib]]
name = "Test"
srcDir = "test"

[[lean_exe]]
name = "bench"
root = "Bench"
srcDir = "bench"

[[lean_exe]]
name = "conformance"
root = "Conformance"
srcDir = "test"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.28.0"
