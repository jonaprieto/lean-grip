name: Benchmark

# Builds the PR, runs `lake exe bench`, re-runs it on the PR's base commit, and posts a
# PR-vs-base table as a single sticky comment (updated in place on every push, so the
# comment always references the current head SHA). Runs automatically on each PR push; a
# `/bench` comment from a trusted commenter re-runs it on demand. Adapted from the
# prim-parser fork's bench workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    # Auto on PR pushes; `/bench` re-run restricted to trusted commenters (it builds and
    # runs PR code). Fork PRs get a read-only token on `pull_request`, so the comment step
    # is guarded below to same-repo PRs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '/bench') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: React to trigger
        if: github.event_name == 'issue_comment'
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes || true

      - name: Resolve PR head and base
        id: pr
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            num=${{ github.event.pull_request.number }}
            sha=${{ github.event.pull_request.head.sha }}
            base=${{ github.event.pull_request.base.sha }}
            same_repo=${{ github.event.pull_request.head.repo.full_name == github.repository }}
          else
            num=${{ github.event.issue.number }}
            sha=$(gh api "repos/${{ github.repository }}/pulls/$num" -q .head.sha)
            base=$(gh api "repos/${{ github.repository }}/pulls/$num" -q .base.sha)
            same_repo=true
          fi
          {
            echo "num=$num"
            echo "sha=$sha"
            echo "base=$base"
            echo "same_repo=$same_repo"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.sha || github.sha }}
          fetch-depth: 0

      # Cache the elan toolchain so a run does not re-download it (avoids the
      # releases.lean-lang.org 429 rate-limit) and the batteries/Grip build.
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-

      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false

      - name: Run benchmarks (PR head, then base)
        run: |
          lake build bench
          lake exe bench > pr.txt 2>/dev/null || true
          echo "== PR ==" && cat pr.txt
          : > base.txt
          if [ -n "${{ steps.pr.outputs.base }}" ]; then
            git checkout -q "${{ steps.pr.outputs.base }}" -- Grip Grip.lean examples bench lakefile.lean lean-toolchain \
              && lake build bench \
              && lake exe bench > base.txt 2>/dev/null \
              && { echo "== base ==" && cat base.txt; } \
              || echo "baseline bench failed; reporting PR only"
          fi

      - name: Format results
        run: |
          {
            echo '<!-- bench -->'
            echo "### Benchmark results (full \`lake exe bench\` suite)"
            echo ""
            echo "PR \`${{ steps.pr.outputs.sha || github.sha }}\` vs base \`${{ steps.pr.outputs.base }}\` -- best-of-20 ms, lower is better. Δ = PR vs base."
            echo ""
            echo "JSON rows are per input file: \`grip\`/\`std.parsec\`/\`hand\` are leaf-count validators, \`grip.json\`/\`lean.json\` are the DOM-vs-DOM value builders."
            echo ""
            # Key each row by parser + input file so the per-file JSON DOM-vs-DOM rows
            # (grip.json/lean.json x canada/citm/twitter) are kept, not collapsed. Single-file
            # benches (sexp, lambda, ...) have a `size=`/`count=` second field and key on $1.
            awk '
              function key() { return ($2 ~ /^(size|count)=/) ? $1 : ($1 " " $2) }
              function getms(  i, a) { for (i = 1; i <= NF; i++) if ($i ~ /^(ms|parse_ms)=/) { split($i, a, "="); return a[2] } return "" }
              FNR == NR { m = getms(); if (m != "") { n = key(); if (!(n in seen)) { ord[++k] = n; seen[n] = 1 }; pr[n] = m }; next }
              { m = getms(); if (m != "") base[key()] = m }
              END {
                print "| benchmark | PR ms | base ms | Δ |"
                print "|---|--:|--:|--:|"
                for (i = 1; i <= k; i++) {
                  n = ord[i]
                  has = (n in base)
                  bm = has ? sprintf("%.2f", base[n]) : "-"
                  d  = (has && base[n] + 0 > 0) ? sprintf("%+.1f%%", (pr[n] - base[n]) / base[n] * 100) : "-"
                  printf "| %s | %.2f | %s | %s |\n", n, pr[n], bm, d
                }
              }' pr.txt base.txt
            echo ""
            echo "_Cross-language parsers (Rust nom, Haskell) run in the separate \`bench-crosslang\` workflow. prim-parser is excluded from CI: its harness path-requires a sibling \`research/prim-parser\` checkout; run it locally for that comparison._"
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      # Sticky comment: --edit-last updates the bot's existing comment in place (so it
      # tracks the head SHA printed in the body), --create-if-none posts the first one.
      # Skipped for fork PRs, whose `pull_request` token cannot write comments.
      - name: Post comment
        if: steps.pr.outputs.num && steps.pr.outputs.same_repo == 'true'
        run: gh pr comment "${{ steps.pr.outputs.num }}" --body-file body.md --edit-last --create-if-none

      - name: React done
        if: github.event_name == 'issue_comment'
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=rocket || true
