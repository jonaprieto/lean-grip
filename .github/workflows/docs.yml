name: docs

# Build the doc-gen4 API documentation from the docstrings and publish it to GitHub Pages.
# doc-gen4 is a dev-only dependency (`-Kenv=dev`), so it never enters a plain `require grip`
# closure; `-R` forces Lake to reconfigure with the dev gate active. One-time setup: in the
# repository settings, set Pages -> Source -> GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-docs-${{ runner.os }}-${{ hashFiles('lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-docs-${{ runner.os }}-
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build API docs (doc-gen4)
        run: |
          lake -R -Kenv=dev update
          lake -R -Kenv=dev build Grip:docs
          touch .lake/build/doc/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .lake/build/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
