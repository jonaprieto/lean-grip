name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean style (100-col / trailing-ws / tabs)
        run: python3 scripts/style-check.py

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Cache the elan toolchain so runs do not re-download it from
      # releases.lean-lang.org (which occasionally 429s), and the batteries/Grip build.
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-core-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: lake-core-${{ runner.os }}-
      - uses: leanprover/lean-action@v1
        with:
          build-args: "Grip Test Examples conformance"
      - name: JSON conformance (JSONTestSuite)
        run: |
          # Deep-nesting corpus files recurse on the Lean stack (`fix`, and `Grip.Json.parse`'s
          # value recursion); raise the limit rather than excluding them from the gate. Numeric
          # hard cap, not the bare `unlimited` keyword: some bash builds reject that with EPERM
          # when the hard limit is itself finite (observed on Darwin; harmless where it isn't).
          ulimit -s "$(ulimit -Hs)"
          # `if !` tests the exit status directly, so a regression fails the job
          # regardless of the shell's `set -e` command-substitution semantics.
          if ! out=$(lake exe conformance); then
            echo "$out"
            echo "conformance gate failed" >&2
            exit 1
          fi
          echo "$out"
          {
            echo "### JSON conformance"
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-bench-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: lake-bench-${{ runner.os }}-
      - uses: leanprover/lean-action@v1
        with:
          build-args: "bench"
      - name: Run benchmark
        run: |
          out=$(lake exe bench)
          echo "$out"
          echo "### grip benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$out" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Assert the leaf counts of every Lean row on all three nativejson datasets: a
          # regression that changed what a parser accepts or counts would flip one of these.
          for row in grip std.parsec hand grip.json lean.json; do
            grep -qE "^$row canada count=111130 "  <<<"$out" || { echo "$row canada count wrong"; exit 1; }
            grep -qE "^$row citm count=16390 "      <<<"$out" || { echo "$row citm count wrong"; exit 1; }
            grep -qE "^$row twitter count=11600 "   <<<"$out" || { echo "$row twitter count wrong"; exit 1; }
          done

  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('grip-props/lean-toolchain', 'lean-toolchain') }}
      - name: Cache grip-props build
        uses: actions/cache@v4
        with:
          path: grip-props/.lake
          key: lake-props-${{ runner.os }}-${{ hashFiles('grip-props/lake-manifest.json', 'lean-toolchain') }}
          restore-keys: lake-props-${{ runner.os }}-
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build grip-props with mathlib cache
        working-directory: grip-props
        run: |
          lake update
          lake exe cache get
          lake build
      - name: Audit JSON round-trip theorem axioms
        working-directory: grip-props
        run: |
          lake env lean GripProps/AxiomAudit.lean | tee /tmp/parse-render-axioms.txt
          grep -Fxq "'GripProps.Container.parse_render' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/parse-render-axioms.txt
