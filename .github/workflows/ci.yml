name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jonaprieto/precommit-lean/.github/actions/precommit@v0.1.6
        with:
          token: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
      - name: Validate README artwork
        run: python3 -c 'import pathlib, xml.etree.ElementTree as ET; [ET.parse(path) for path in pathlib.Path("assets").glob("*.svg")]'

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Cache the elan toolchain so runs do not re-download it from
      # releases.lean-lang.org (which occasionally 429s), and the batteries/Grip build.
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v6
        with:
          path: .lake
          key: lake-core-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: lake-core-${{ runner.os }}-
      - uses: leanprover/lean-action@v1
        with:
          build-args: "Grip Test Examples bench"

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v6
        with:
          path: .lake
          key: lake-bench-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: lake-bench-${{ runner.os }}-
      - uses: leanprover/lean-action@v1
        with:
          build-args: "bench"
      - name: Run benchmark
        run: |
          out=$(lake exe bench)
          echo "$out"
          {
            echo "### grip benchmark"
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -qE '^sexp .* count=50000 ' <<<"$out"
          grep -qE '^lambda .* count=1 ' <<<"$out"
          grep -qE '^http .* count=10000 ' <<<"$out"
          grep -qE '^toml .* count=307 ' <<<"$out"
          grep -qE '^yaml .* count=30001 ' <<<"$out"

  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache elan toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('grip-props/lean-toolchain', 'lean-toolchain') }}
      - name: Cache grip-props build
        uses: actions/cache@v6
        with:
          path: grip-props/.lake
          key: lake-props-${{ runner.os }}-${{ hashFiles('grip-props/lake-manifest.json', 'lean-toolchain') }}
          restore-keys: lake-props-${{ runner.os }}-
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build grip-props with mathlib cache
        working-directory: grip-props
        run: |
          lake update
          lake exe cache get
          lake build
      - name: Audit core completeness theorem axioms
        working-directory: grip-props
        run: lake env lean -R . GripProps/AxiomAudit.lean
